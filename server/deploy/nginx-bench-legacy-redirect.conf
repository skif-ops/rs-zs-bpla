# Preserve the provider hostname as a redirect after bench.dioneya.ru is active.
server {
    listen 80;
    listen [::]:80;
    server_name nginx3777.hostkey.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://bench.dioneya.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nginx3777.hostkey.in;

    ssl_certificate /etc/letsencrypt/live/nginx3777.hostkey.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nginx3777.hostkey.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nginx3777.hostkey.in/chain.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bench.dioneya.ru$request_uri;
}
