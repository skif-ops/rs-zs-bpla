# Public HTTPS gateway for the isolated Muhoed bench.
# The password file is provisioned on the server and must never be committed.
server {
    listen 80;
    listen [::]:80;
    server_name bench.dioneya.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://bench.dioneya.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bench.dioneya.ru;

    ssl_certificate /etc/letsencrypt/live/bench.dioneya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bench.dioneya.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 512m;
    access_log /var/log/nginx/muhoed-bench.access.log;
    error_log /var/log/nginx/muhoed-bench.error.log;

    auth_basic "Dioneya bench";
    auth_basic_user_file /etc/nginx/.htpasswd-muhoed-bench;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
