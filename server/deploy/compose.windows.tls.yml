# tls/: ca-chain.pem, server.crt.pem, server.key.pem, crl.pem, bridge.crt.pem, bridge.key.pem (from server/pki)
services:
  mqtt:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.ubuntu.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/station_acl.conf:/mosquitto/config/station_acl.conf:ro
      - ./tls:/mosquitto/certs:ro
      - mqtt_data:/mosquitto/data
  server:
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data:/app/data
      - ../output:/app/output
    depends_on:
      - mqtt
  mqtt_bridge_pilot1:
    build:
      context: ..
    restart: unless-stopped
    command: ["python", "-m", "station.mqtt_bridge", "--host", "mqtt", "--port", "8883", "--tenant", "pilot1", "--ca", "/run/tls/ca-chain.pem", "--cert", "/run/tls/bridge.crt.pem", "--key", "/run/tls/bridge.key.pem"]
    environment:
      ZS_TENANT: pilot1
      ZS_COMMAND_SIGNING_KEY: /run/tls/command-signing.key
    volumes:
      - ../data:/app/data
      - ./tls:/run/tls:ro
    depends_on:
      - mqtt
      - server
  mqtt_bridge_pilot2:
    build:
      context: ..
    restart: unless-stopped
    command: ["python", "-m", "station.mqtt_bridge", "--host", "mqtt", "--port", "8883", "--tenant", "pilot2", "--ca", "/run/tls/ca-chain.pem", "--cert", "/run/tls/bridge.crt.pem", "--key", "/run/tls/bridge.key.pem"]
    environment:
      ZS_TENANT: pilot2
      ZS_COMMAND_SIGNING_KEY: /run/tls/command-signing.key
    volumes:
      - ../data:/app/data
      - ./tls:/run/tls:ro
    depends_on:
      - mqtt
      - server
  mqtt_bridge_bench:
    build:
      context: ..
    restart: unless-stopped
    command: ["python", "-m", "station.mqtt_bridge", "--host", "mqtt", "--port", "8883", "--tenant", "bench", "--ca", "/run/tls/ca-chain.pem", "--cert", "/run/tls/bridge.crt.pem", "--key", "/run/tls/bridge.key.pem"]
    environment:
      ZS_TENANT: bench
      ZS_COMMAND_SIGNING_KEY: /run/tls/command-signing.key
    volumes:
      - ../data:/app/data
      - ./tls:/run/tls:ro
    depends_on:
      - mqtt
      - server
volumes:
  mqtt_data:
