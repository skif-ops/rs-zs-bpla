{% extends "base.html" %}
{% block title %}Мухоед - локализация{% endblock %}
{% block content %}
<section class="page-header compact">
  <h1>Локализация по нескольким микрофонам</h1>
  <p>Загрузите WAV/MP3/M4A-файлы микрофонов и mics.json с координатами массива.</p>
</section>

<form class="upload-panel" action="/localization/analyze" method="post" enctype="multipart/form-data">
  <label class="form-label" for="wav_files">WAV, MP3 или M4A файлы микрофонов</label>
  <input class="form-control form-control-lg" id="wav_files" name="wav_files" type="file" accept=".wav,.mp3,.m4a,.aac,audio/wav,audio/mpeg,audio/mp4,audio/aac" multiple required>

  <label class="form-label mt-3" for="mics_json">mics.json</label>
  <input class="form-control form-control-lg" id="mics_json" name="mics_json" type="file" accept=".json,application/json" required>

  <button class="btn btn-primary btn-lg mt-3" type="submit">Локализовать</button>
</form>
{% endblock %}
