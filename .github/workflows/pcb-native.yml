name: PCB Native Gate

on:
  workflow_dispatch:
  push:
    branches: [evt-pre-20]
    paths:
      - "hardware/kicad/**"
      - "hardware/*FREEZE_REV_A.csv"
      - "tools/kicad_native_gate.py"
      - "tools/generate_pcb_mic_native.py"
      - ".github/workflows/pcb-native.yml"

jobs:
  native-kicad:
    name: Native KiCad per-board ERC DRC and fabrication export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engineering preflight
        id: native
        shell: bash
        run: |
          python tools/kicad_native_gate.py
          any=false
          for b in PCB-MAIN PCB-MIC PCB-PWR; do
            base="hardware/kicad/native/$b/$b"
            if [ -f "$base.kicad_sch" ] && [ -f "$base.kicad_pcb" ] && [ -f "$base.kicad_pro" ]; then
              any=true
            fi
          done
          echo "any_ready=$any" >> "$GITHUB_OUTPUT"
      - name: Install and identify KiCad toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kicad
          kicad-cli version
          echo '--- pcb drc support ---'
          kicad-cli pcb drc --help || true
          echo '--- sch erc support ---'
          kicad-cli sch erc --help || true
          /usr/bin/python3 - <<'PY'
          try:
              import pcbnew
              print("PCBNEW_PYTHON_AVAILABLE", pcbnew.GetBuildVersion())
          except Exception as exc:
              print("PCBNEW_PYTHON_UNAVAILABLE", repr(exc))
          PY
      - name: Import PCB-MIC secondary reference CAD
        run: |
          python -m pip install --disable-pip-version-check easyeda2kicad
          mkdir -p artifacts/kicad-reference/PCB-MIC
          ROOT="$PWD/artifacts/kicad-reference/PCB-MIC"
          easyeda2kicad --full --lcsc_id=C7230692 --output "$ROOT/t5838_ref" --project-relative
          easyeda2kicad --full --lcsc_id=C563981 --output "$ROOT/molex_5040500691_ref" --project-relative
          find artifacts/kicad-reference/PCB-MIC -maxdepth 4 -type f -print | sort
          printf '%s\n' 'REFERENCE_ONLY_NOT_RELEASED: EasyEDA/LCSC CAD must be checked against TDK/Molex manufacturer data before use.' > artifacts/kicad-reference/PCB-MIC/REFERENCE_STATUS.txt
      - name: ERC DRC and fabrication export for every complete board
        if: steps.native.outputs.any_ready == 'true'
        run: python tools/kicad_native_gate.py --run-cli
      - name: Upload native gate and reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evt-pre-20-kicad-native-gate
          path: |
            artifacts/kicad-native/
            artifacts/kicad-reference/
          if-no-files-found: error
