name: Release integrity

on:
  push:
    branches: [main, develop, evt, evt-mb]
  pull_request:
    branches: [main, develop]

jobs:
  verify-release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify full EVT archive
        shell: bash
        run: |
          set -euo pipefail
          file='releases/evt/v0.7/РС_ЗС-БПЛА_EVT_gate_3plus1_v0_7.zip'
          if [[ -f "$file" ]]; then
            echo '37eaee4e85e8f12f26da3fbd3a7c40d4cda19c9192dca2e5bb30963435747e6c' " $file" | sha256sum -c -
            unzip -t "$file"
          fi
      - name: Verify EVT-MB assembly archive
        shell: bash
        run: |
          set -euo pipefail
          dir='releases/evt-mb/v1.2'
          if [[ -d "$dir/parts" ]]; then
            (cd "$dir" && sha256sum -c PARTS_SHA256.txt)
            find "$dir/parts" -maxdepth 1 -type f -name 'part-*' -print0 | sort -z | xargs -0 cat -- > /tmp/evt-mb-v1.2.zip
            echo 'e5b1a2619d6048c0bf67f5e3b37c3ff8c1cc07930802f876f4f202cbfa795f57  /tmp/evt-mb-v1.2.zip' | sha256sum -c -
            unzip -t /tmp/evt-mb-v1.2.zip
          fi
      - name: Verify EVT-MB methods archive
        shell: bash
        run: |
          set -euo pipefail
          file='releases/evt-mb/v1.2.1/РС_Дионея_EVT_MB_v1_2_1_ПМИ_и_отчетные_материалы_OPEN.zip'
          if [[ -f "$file" ]]; then
            echo 'd9733461a9bb8c879439c443c7748f0faba6c5b74ffc3bf5a90d1fc987c77181' " $file" | sha256sum -c -
            unzip -t "$file"
          fi
      - name: Verify audio result archive
        shell: bash
        run: |
          set -euo pipefail
          dir='releases/audio/2026-09-07'
          if [[ -d "$dir/parts" ]]; then
            (cd "$dir" && sha256sum -c PARTS_SHA256.txt)
            find "$dir/parts" -maxdepth 1 -type f -name 'part-*' -print0 | sort -z | xargs -0 cat -- > /tmp/audio-results.zip
            echo '84b9ad6cead103ce19abc94ca49f222ac863133113549e228708a70ab1364466  /tmp/audio-results.zip' | sha256sum -c -
            unzip -t /tmp/audio-results.zip
          fi

