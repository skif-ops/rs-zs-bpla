name: Release integrity

on:
  push:
    branches: [main, develop, evt, evt-mb, "integration/**"]
  pull_request:
    branches: [main, develop]

jobs:
  verify-release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify full EVT archive
        shell: bash
        run: |
          set -euo pipefail
          file='releases/evt/v0.7/РС_ЗС-БПЛА_EVT_gate_3plus1_v0_7.zip'
          if [[ -f "$file" ]]; then
            echo '37eaee4e85e8f12f26da3fbd3a7c40d4cda19c9192dca2e5bb30963435747e6c' " $file" | sha256sum -c -
            unzip -t "$file"
          fi
      - name: Verify current EVT-MB v1.3 archives
        shell: bash
        run: |
          set -euo pipefail
          dir='releases/evt-mb/v1.3'
          if [[ -d "$dir/assembly_parts" && -d "$dir/report_parts" ]]; then
            (cd "$dir/assembly_parts" && sha256sum -c ../ASSEMBLY_PARTS_SHA256.txt)
            (cd "$dir/report_parts" && sha256sum -c ../REPORT_PARTS_SHA256.txt)
            find "$dir/assembly_parts" -maxdepth 1 -type f -name 'part-*' -print0 | sort -z | xargs -0 cat -- > /tmp/evt-mb-v1.3-assembly.zip
            find "$dir/report_parts" -maxdepth 1 -type f -name 'part-*' -print0 | sort -z | xargs -0 cat -- > /tmp/evt-mb-v1.3-report.zip
            echo 'df7275e4915da534fee284e78c6eef6419b1672223d2c823707140cee6dfb446  /tmp/evt-mb-v1.3-assembly.zip' | sha256sum -c -
            echo '0e997293fdceb396dfc5c8fb9b0e482bbb413d6af4fd47e00cfb42090e3f5ecb  /tmp/evt-mb-v1.3-report.zip' | sha256sum -c -
            unzip -t /tmp/evt-mb-v1.3-assembly.zip
            unzip -t /tmp/evt-mb-v1.3-report.zip
          fi
      - name: Verify audio result archive
        shell: bash
        run: |
          set -euo pipefail
          dir='releases/audio/2026-09-07'
          if [[ -d "$dir/parts" ]]; then
            (cd "$dir" && sha256sum -c PARTS_SHA256.txt)
            find "$dir/parts" -maxdepth 1 -type f -name 'part-*' -print0 | sort -z | xargs -0 cat -- > /tmp/audio-results.zip
            echo '84b9ad6cead103ce19abc94ca49f222ac863133113549e228708a70ab1364466  /tmp/audio-results.zip' | sha256sum -c -
            unzip -t /tmp/audio-results.zip
          fi
