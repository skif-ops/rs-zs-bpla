      - "tools/materialize_pcb_pwr_libraries_rev_a.py"
      - "tools/materialize_pcb_pwr_hierarchy_rev_a.py"
      - "tools/pcb_pwr_schematic_hierarchy.py"
      - "tools/audit_pcb_pwr_hierarchy_rev_a.py"
      - "tools/audit_pcb_pwr_native_schematic_rev_a.py"
      - "tools/audit_pcb_pwr_native_completeness_rev_a.py"
      - "tools/audit_pcb_pwr_footprints_rev_a.py"
      - "tools/audit_pcb_pwr_passive_authority_rev_a.py"
      - "tools/audit_pcb_pwr_layout_candidate_rev_a.py"
      - "tools/audit_pcb_pwr_placement_clearance_rev_a.py"
      - "tools/generate_pcb_pwr_layout_candidate_rev_a.py"
      - "tools/generate_pcb_pwr_routing_authority_rev_a.py"
      - "tools/audit_pcb_pwr_routing_authority_rev_a.py"
      - "tools/generate_pcb_pwr_evt_route_rules_rev_a.py"
      - "tools/audit_pcb_pwr_jlc04161h_3313_evt_routing_basis_rev_a.py"
      - "tools/audit_pcb_pwr_dim_003_request_rev_a.py"
      - "tools/generate_pcb_pwr_evt_mechanical_step_rev_a.py"
      - "tools/audit_pcb_pwr_stackup_copper_request_rev_a.py"
      - "tools/audit_pcb_pwr_input_protection_rev_a.py"
      - "tools/audit_pcb_pwr_input_protection_sources_rev_a.py"
      - "tools/audit_pcb_pwr_input_protection_procurement_identity_rev_a.py"
      - ".github/workflows/pcb-pwr-schematic.yml"

jobs:
  pwr-schematic:
    name: PCB-PWR Rev.A native schematic ERC
    runs-on: ubuntu-latest
    container:
      # Official KiCad CI image: https://www.kicad.org/download/docker/
      image: ghcr.io/kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Trust container checkout for commit-bound audits
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install audit parser dependency
        run: |
          apt-get -o APT::Update::Error-Mode=any update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-pip python-is-python3
          python3 -m pip install --break-system-packages --disable-pip-version-check \
            'kiutils==1.4.8'

      - name: Review-A authorities and DFT freeze
        run: |
          python tools/audit_pcb_pwr_design_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/design_audit.json
          python tools/audit_pcb_pwr_preschematic_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/preschematic_audit.json
          python tools/audit_pcb_pwr_capture_authority_rev_a.py
          python tools/audit_pcb_pwr_dft_authority_rev_a.py
          python tools/audit_pcb_pwr_input_protection_sources_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/input_protection_primary_source_audit.json
          python tools/audit_pcb_pwr_input_protection_procurement_identity_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/input_protection_procurement_identity_audit.json
          python tools/audit_pcb_pwr_input_protection_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/input_protection_qualification_audit.json
          python tools/audit_pcb_pwr_dim_003_request_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/committed_dim_003_request_audit.json \
            --commit-sha "$GITHUB_SHA" \
            --require-clean-source
          python tools/audit_pcb_pwr_stackup_copper_request_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/committed_stackup_copper_request_audit.json \
            --commit-sha "$GITHUB_SHA" \
            --require-clean-source

      - name: Verify official KiCad 9.0.9 container toolchain
        run: |
          set -euo pipefail
          kicad_version="$(kicad-cli version)"
          echo "KiCad CLI version: $kicad_version"
          case "$kicad_version" in
            9.0.9*) ;;
            *)
              echo "Pinned KiCad 9.0.9 required; refusing installed version: $kicad_version" >&2
              exit 1
              ;;
          esac
          test -s /usr/share/kicad/symbols/Connector_Generic.kicad_sym
          test -s /usr/share/kicad/symbols/Device.kicad_sym
          /usr/bin/python3 - <<'PY'
          import pcbnew
          version = pcbnew.GetBuildVersion()
          assert version.startswith("9.0.9"), version
          print("PCBNEW_PYTHON_AVAILABLE", version)
          PY

      - name: Materialize complete PCB-PWR native schematic
        run: |
          python tools/generate_pcb_pwr_schematic_rev_a.py \
            --output hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/finalize_pcb_pwr_symbol_types_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/finalize_pcb_pwr_schematic_completeness_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/finalize_pcb_pwr_passive_authority_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/finalize_pcb_pwr_erc_power_model_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/materialize_pcb_pwr_libraries_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/materialize_pcb_pwr_hierarchy_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/audit_pcb_pwr_hierarchy_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/hierarchy_audit.json
          python tools/audit_pcb_pwr_native_schematic_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/audit_pcb_pwr_native_completeness_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/audit_pcb_pwr_footprints_rev_a.py
          python tools/audit_pcb_pwr_passive_authority_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          python tools/audit_pcb_pwr_layout_candidate_rev_a.py
          python tools/audit_pcb_pwr_placement_clearance_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/placement_clearance_audit.json \
            --strict
          python tools/generate_pcb_pwr_routing_authority_rev_a.py --check
          python tools/audit_pcb_pwr_routing_authority_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/routing_authority_audit.json
          python tools/generate_pcb_pwr_evt_route_rules_rev_a.py --check
          python tools/audit_pcb_pwr_jlc04161h_3313_evt_routing_basis_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/evt_routing_basis_audit.json
          python tools/audit_pcb_pwr_dim_003_request_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/dim_003_request_audit.json
          python tools/audit_pcb_pwr_stackup_copper_request_rev_a.py \
            --output artifacts/kicad-native/PCB-PWR/stackup_copper_request_audit.json
          git diff --exit-code -- hardware/kicad/native/PCB-PWR/PCB-PWR*.kicad_sch
          test -s hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
          test "$(find hardware/kicad/native/PCB-PWR -maxdepth 1 -name 'PCB-PWR_*.kicad_sch' -type f | wc -l)" -eq 4
          test -s hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_pcb
          test -s hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_pro
          test -s hardware/kicad/native/PCB-PWR/sym-lib-table
          test -s hardware/kicad/native/PCB-PWR/fp-lib-table
          test -s hardware/kicad/native/PCB-PWR/libs/DioneyaPWR.kicad_sym
          /usr/bin/python3 - <<'PY'
          import pcbnew
          root = "hardware/kicad/native/PCB-PWR/libs/DioneyaPWR.pretty"
          expected = {
              "CSD18540Q5B_DNK": 27,
              "LMR60440_RAK0009A": 20,
              "TI_DBV0006A_SOT23-6": 6,
              "TI_DGS0010A_VSSOP10": 10,
              "Molex_43045-0213_MicroFit-2_Vertical": 4,
              "Vishay_WSK2512_4T_T1.19mm": 4,
              "Coilcraft_XAL7030_472": 2,
              "TestPoint_DFT_1.7mm_NoPaste": 1,
              "MountingHole_M3_3.4_EVT": 1,
          }
          for name, pad_count in expected.items():
              footprint = pcbnew.FootprintLoad(root, name)
              assert footprint is not None, f"KiCad failed to parse {name}"
              assert footprint.GetPadCount() == pad_count, f"{name}: pad/aperture count drift"
          shared_root = "hardware/kicad/native/PCB-MAIN/libs/DioneyaMain.pretty"
          footprint = pcbnew.FootprintLoad(shared_root, "TI_DBV0005A_SOT23-5")
          assert footprint is not None, "KiCad failed to parse shared TI_DBV0005A_SOT23-5"
          assert footprint.GetPadCount() == 5, "shared TI_DBV0005A_SOT23-5 pad-count drift"
          print("PCB-PWR controlled footprints KiCad 9 native parse: PASS")
          PY

      - name: KiCad ERC
        run: |
          mkdir -p artifacts/kicad-native/PCB-PWR
          kicad-cli sch erc --format json --severity-all --exit-code-violations \
            -o artifacts/kicad-native/PCB-PWR/erc.json \
            hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch

      - name: KiCad PDF
        if: always()
        run: |
          mkdir -p artifacts/kicad-native/PCB-PWR
          kicad-cli sch export pdf \
            -o artifacts/kicad-native/PCB-PWR/PCB-PWR_schematic.pdf \
            hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch

      - name: Verify ERC report has zero violations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/kicad-native/PCB-PWR/erc.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          violations = [v for s in d.get('sheets', []) for v in s.get('violations', [])]
          if violations:
              raise SystemExit(f'PCB-PWR ERC still has {len(violations)} violations: ' + ', '.join(sorted({v.get("type", "unknown") for v in violations})))
          print('PCB-PWR KiCad ERC PASS: 0 violations')
          PY

      - name: Upload PCB-PWR schematic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evt-pre-20-pcb-pwr-schematic
          path: |
            artifacts/kicad-native/PCB-PWR/
            hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
            hardware/kicad/native/PCB-PWR/PCB-PWR_*.kicad_sch
            hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_pcb
            hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_pro
            hardware/kicad/native/PCB-PWR/sym-lib-table
            hardware/kicad/native/PCB-PWR/fp-lib-table
            hardware/kicad/native/PCB-PWR/libs/
            hardware/PCB_PWR_PLACEMENT_CANDIDATE_REV_A.csv
            hardware/PCB_PWR_PLACEMENT_CANDIDATE_REV_A.md
            hardware/reviews/PCB_PWR_DIM_003_REQUEST_REV_A.json
            hardware/reviews/PCB_PWR_DIM_003_REQUEST_REV_A.md
            hardware/reviews/PCB_PWR_DIM_003_RESPONSE_REV_A.csv
            hardware/reviews/PCB_PWR_DIM_003_EVT_AUTHORITY_REV_A.json
            hardware/reviews/PCB_PWR_DIM_003_EVT_AUTHORITY_REV_A.md
            mechanics/pcb_pwr/PCB_PWR_EVT_MECHANICAL_ENVELOPE_REV_A.step
            hardware/reviews/PCB_PWR_STACKUP_COPPER_REQUEST_REV_A.json
            hardware/reviews/PCB_PWR_STACKUP_COPPER_REQUEST_REV_A.md
            hardware/reviews/PCB_PWR_STACKUP_COPPER_RESPONSE_REV_A.csv
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_QUALIFICATION_REV_A.json
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_QUALIFICATION_REV_A.md
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_TEST_MATRIX_REV_A.csv
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_PRIMARY_SOURCE_EVIDENCE_REV_A.json
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_PRIMARY_SOURCE_EVIDENCE_REV_A.md
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_PROCUREMENT_IDENTITY_REV_A.json
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_PROCUREMENT_IDENTITY_REV_A.md
            hardware/reviews/PCB_PWR_HIERARCHY_REVIEW_REV_A.md
            hardware/PCB_PWR_ROUTING_AUTHORITY_REV_A.csv
            hardware/PCB_PWR_ROUTING_AUTHORITY_REV_A.md
            hardware/PCB_PWR_EVT_ROUTE_RULES_REV_A.csv
            hardware/reviews/PCB_PWR_JLC04161H_3313_EVT_ROUTING_BASIS_REV_A.json
            hardware/reviews/PCB_PWR_JLC04161H_3313_EVT_ROUTING_BASIS_REV_A.md
            hardware/PCB_PWR_CAPTURE_STATUS_REV_A.json
            hardware/reviews/PCB_PWR_PLACEMENT_CLEARANCE_REV_A.md
            hardware/reviews/PCB_PWR_REVIEW_B_CHECKLIST_REV_A.md
            hardware/reviews/PCB_PWR_TI_PRIMARY_SOURCE_EVIDENCE_REV_A.json
            hardware/reviews/PCB_PWR_TI_PRIMARY_SOURCE_EVIDENCE_REV_A.md
          if-no-files-found: error
