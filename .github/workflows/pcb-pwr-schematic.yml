      - "hardware/PCB_PWR_PLACEMENT_CANDIDATE_REV_A.csv"
      - "hardware/PCB_PWR_PLACEMENT_CANDIDATE_REV_A.md"
      - "hardware/PCB_PWR_ROUTING_AUTHORITY_REV_A.csv"
