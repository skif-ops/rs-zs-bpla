name: ci-dispatch
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: echo "matrix=$(jq -c . ci/jobs.json)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.shell == 'bash'
        run: bash ${{ matrix.script }}
      - if: matrix.shell == 'pwsh'
        shell: pwsh
        run: pwsh -File ${{ matrix.script }}
      - if: matrix.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 30
  pcb-main-candidate-075:
    if: github.ref == 'refs/heads/feature/pcb-main-completion' || github.head_ref == 'feature/pcb-main-completion'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pcb-main-completion
      - name: Install candidate geometry dependencies
        run: |
          apt-get -o APT::Update::Error-Mode=any update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pip
          /usr/bin/python3 -m pip install --break-system-packages --disable-pip-version-check \
            'kiutils==1.4.8' 'shapely>=2,<3' 'numpy==2.0.2'
      - name: Run native KiCad 9 candidate ERC and DRC
        env:
          DIONEYA_KICAD_DIRECT: '1'
        run: |
          /usr/bin/python3 tools/apply_pcb_main_batch_075_rev_a.py
          /usr/bin/python3 tools/apply_pcb_main_u3_power_076_rev_a.py
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcb-main-candidate-075
          path: hardware/kicad/candidates/PCB-ROUTING-P2-ASTAR-075/
      - name: Upload U3 power relief candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcb-main-candidate-076
          path: hardware/kicad/candidates/PCB-ROUTING-P2-U3-POWER-076/
      - name: Commit verified candidate evidence to feature branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add hardware/kicad/candidates/PCB-ROUTING-P2-ASTAR-075/PCB-MAIN_P2_ASTAR_075_CANDIDATE_REV_A.kicad_pcb \
                  hardware/kicad/candidates/PCB-ROUTING-P2-ASTAR-075/PCB-MAIN_P2_ASTAR_075_CANDIDATE_REV_A.kicad_pro \
                  hardware/kicad/candidates/PCB-ROUTING-P2-ASTAR-075/{SUMMARY,drc_candidate,erc_candidate}.json \
                  hardware/kicad/candidates/PCB-ROUTING-P2-U3-POWER-076/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'PCB-MAIN: record native KiCad 9 candidates 075-076 (39 open, ERC 0)'
            git push origin HEAD:feature/pcb-main-completion
          fi
