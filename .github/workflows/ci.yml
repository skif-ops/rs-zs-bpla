name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, evt, evt-mb, evt-pre-20, "feature/**"]
  pull_request:
    branches: [main, develop, evt, evt-mb, evt-pre-20]

jobs:
  firmware:
    name: Firmware CMake/CTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
      - name: Build with warnings enabled
        run: cmake --build firmware/build --parallel
      - name: CTest
        run: ctest --test-dir firmware/build --output-on-failure

  server-core:
    name: Server core pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-ci.txt
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-ci.txt
      - name: Core pytest
        working-directory: server
        run: python -m pytest -q tests_core

  server-full:
    name: Server full pytest and compileall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
      - name: Compile Python sources
        working-directory: server
        run: python -m compileall -q .
      - name: Materialize versioned test assets
        working-directory: server
        run: python tools/materialize_assets.py
      - name: Full pytest
        working-directory: server
        run: python -m pytest -q tests

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Unit tests and debug build
        run: gradle --no-daemon --stacktrace -p android testDebugUnitTest assembleDebug

  protocol-e2e:
    name: Firmware CBOR to Server
    runs-on: ubuntu-latest
    needs: [firmware, server-core, server-full, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protocol dependency
        run: pip install 'pydantic>=2.7,<3'
      - name: Build firmware packet emitter
        run: |
          cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/build --parallel --target zs_emit_detection
      - name: Verify compact CBOR contract
        working-directory: server
        run: python tools/test_firmware_packet.py
