name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, evt, evt-mb, evt-pre-20, "feature/**"]
  pull_request:
    branches: [main, develop, evt, evt-mb, evt-pre-20]

jobs:
  evt-pre-20-config:
    name: EVT-PRE-20 configuration and release audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First-pass configuration and hardware baseline validation
        run: python tools/validate_evt_pre_20.py
      - name: Second-pass release completeness audit
        run: python tools/audit_evt_pre_20_release.py
      - name: Upload second-pass audit report
        uses: actions/upload-artifact@v4
        with:
          name: evt-pre-20-release-audit
          path: artifacts/evt_pre_20_release_audit.json
          if-no-files-found: error

  firmware:
    name: Firmware CMake/CTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
      - name: Build with warnings enabled
        run: cmake --build firmware/build --parallel
      - name: CTest
        run: ctest --test-dir firmware/build --output-on-failure

  server-core:
    name: Server core pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-ci.txt
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-ci.txt
      - name: Core pytest
        working-directory: server
        run: python -m pytest -q tests_core

  server-full:
    name: Server full pytest and compileall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
      - name: Compile Python sources
        working-directory: server
        run: python -m compileall -q .
      - name: Materialize versioned test assets
        working-directory: server
        run: python tools/materialize_assets.py
      - name: Full pytest
        working-directory: server
        run: python -m pytest -q tests

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Unit tests and debug build
        run: gradle --no-daemon --stacktrace -p android testDebugUnitTest assembleDebug
      - name: Upload installable EVT commissioning APK
        uses: actions/upload-artifact@v4
        with:
          name: dioneya-commissioning-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  protocol-e2e:
    name: Firmware CBOR to Server
    runs-on: ubuntu-latest
    needs: [evt-pre-20-config, firmware, server-core, server-full, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protocol dependency
        run: pip install 'pydantic>=2.7,<3'
      - name: Build firmware packet emitter
        run: |
          cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/build --parallel --target zs_emit_detection
      - name: Verify compact CBOR contract
        working-directory: server
        run: python tools/test_firmware_packet.py

  package-current:
    name: Build current engineering and PMI archives
    runs-on: ubuntu-latest
    needs: [protocol-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build reproducible current-state archives
        run: python tools/build_evt_pre_20_packages.py
      - name: Upload engineering and separate PMI/report archives
        uses: actions/upload-artifact@v4
        with:
          name: evt-pre-20-current-packages
          path: artifacts/evt-pre-20-current/
          if-no-files-found: error
