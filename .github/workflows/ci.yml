  firmware:
    name: Firmware CMake/CTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
      - name: Build with warnings enabled
        run: cmake --build firmware/build --parallel
      - name: CTest
        run: ctest --test-dir firmware/build --output-on-failure

  server-core:
    name: Server core pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-ci.lock.txt
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements-ci.lock.txt
      - name: Core pytest
        working-directory: server
        run: python -m pytest -q tests_core

  server-full:
    name: Server full pytest and compileall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock.txt
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements.lock.txt
      - name: Compile Python sources
        working-directory: server
        run: python -m compileall -q .
      - name: Materialize versioned test assets
        working-directory: server
        run: python tools/materialize_assets.py
      - name: QG-1 hashed dependency lock and SBOM traceability
        run: python tools/validate_server_supply_chain.py
      - name: QG-2 independent CycloneDX SBOM audit
        run: python tools/audit_server_sbom_technical.py
      - name: Verify reproducible CycloneDX SBOM
        run: python tools/generate_server_sbom.py --check
      - name: QG-1 station HTTP fail-closed contract
        run: python tools/validate_station_http_transport.py
      - name: QG-2 independent station HTTP runtime audit
        run: python tools/audit_station_http_transport_technical.py
      - name: QG-1 signed MQTT command transport contract
        run: python tools/validate_mqtt_command_transport.py
      - name: Verify server-to-firmware signed command vector
        run: python tools/generate_mqtt_command_vector.py --check
      - name: QG-2 independent MQTT command runtime audit
        run: python tools/audit_mqtt_command_transport_technical.py
      - name: Verify server-to-firmware event receipt vector
        run: python tools/generate_event_receipt_vector.py --check
      - name: QG-2 independent event application receipt runtime audit
        run: python tools/audit_event_receipt_technical.py
      - name: Full pytest
        working-directory: server
        run: python -m pytest -q tests

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Unit tests and debug build
        run: gradle --no-daemon --stacktrace -p android testDebugUnitTest assembleDebug
      - name: Upload installable EVT commissioning APK
        uses: actions/upload-artifact@v4
        with:
          name: dioneya-commissioning-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  protocol-e2e:
    name: Firmware CBOR to Server
    runs-on: ubuntu-latest
    needs: [firmware, server-core, server-full, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protocol dependency
        run: pip install --require-hashes -r server/requirements-protocol.lock.txt
      - name: Build firmware packet emitter
        run: |
          cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/build --parallel --target zs_emit_detection zs_emit_heartbeat
      - name: Verify compact CBOR contract
        working-directory: server
        run: python tools/test_firmware_packet.py

  package-current:
    name: Build current EVT-PRE-20 engineering and PMI archives
    if: github.ref == 'refs/heads/evt-pre-20' || github.base_ref == 'evt-pre-20'
    runs-on: ubuntu-latest
    needs: [evt-pre-20-config, protocol-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate unified Rev.A BOM
        run: python tools/generate_evt_pre_20_bom_rev_a.py
      - name: Build reproducible current-state archives
        run: python tools/build_evt_pre_20_packages.py
      - name: Audit external-response request archive and checksums
        run: |
          python tools/audit_evt_pre_20_external_response_bundle.py \
            --archive artifacts/evt-pre-20-current/Dioneya_EVT_PRE_20_EXTERNAL_RESPONSE_REQUESTS_CURRENT.zip \
            --sums artifacts/evt-pre-20-current/SHA256SUMS.txt \
            --output artifacts/evt-pre-20-current/EXTERNAL_RESPONSE_BUNDLE_AUDIT.json
      - name: Upload engineering and separate PMI/report archives
        uses: actions/upload-artifact@v4
        with:
          name: evt-pre-20-current-packages
          path: artifacts/evt-pre-20-current/
          if-no-files-found: error
