name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  firmware:
    name: Firmware CMake/CTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
      - name: Build with warnings enabled
        run: cmake --build firmware/build --parallel
      - name: CTest
        run: ctest --test-dir firmware/build --output-on-failure

  server:
    if: ${{ false }} # enabled when server source tree lands in develop
    name: Server pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - working-directory: server
        run: python -m pytest -q

  protocol-e2e:
    if: ${{ false }} # enabled together with server job
    name: Firmware CBOR -> Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "server source pending in develop"
