name: CI

on:
  workflow_dispatch:
  push:
    branches: [evt-pre-20]
  pull_request:
    branches: [evt-pre-20]

jobs:
  evt-pre-20-config:
    name: EVT-PRE-20 configuration and release audit
    if: github.ref == 'refs/heads/evt-pre-20' || github.base_ref == 'evt-pre-20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install controlled PCB audit parser
        run: python -m pip install kiutils==1.4.8
      - name: Enforce EVT branch isolation
        if: github.ref == 'refs/heads/evt-pre-20' || github.base_ref == 'evt-pre-20'
        run: python tools/audit_evt_branch_isolation.py --branch evt-pre-20
      - name: Verify committed unified Rev.A BOM outputs
        run: python tools/generate_evt_pre_20_bom_rev_a.py --check
      - name: QG-1 production BOM structure and quantity audit
        run: python tools/validate_evt_pre_20_bom_qg1.py
      - name: Independent BOM workbook-to-CSV audit
        run: python tools/audit_evt_pre_20_bom_workbook.py
      - name: Independent PCB layer-count authority audit
        run: python tools/audit_pcb_layer_count_authority_rev_a.py --output artifacts/pcb_layer_count_authority_rev_a.json
      - name: Independent harness manufacturing drawing audit
        run: python tools/audit_harness_manufacturing_rev_a.py --output artifacts/harness_manufacturing_rev_a.json
      - name: QG-2 independent production BOM technical audit
        run: python tools/audit_evt_pre_20_bom_qg2.py
      - name: PCB-PWR input-protection qualification control
        run: |
          python tools/audit_pcb_pwr_input_protection_sources_rev_a.py \
            --output artifacts/pcb_pwr_input_protection_primary_source_evidence_rev_a.json
          python tools/audit_pcb_pwr_input_protection_procurement_identity_rev_a.py \
            --output artifacts/pcb_pwr_input_protection_procurement_identity_rev_a.json
          python tools/audit_pcb_pwr_input_protection_rev_a.py \
            --output artifacts/pcb_pwr_input_protection_qualification_rev_a.json
      - name: Hardware-only design and purchase release audit
        run: python tools/audit_evt_pre_20_hardware_release.py
      - name: Audit controlled external-response request bundle inputs
        run: |
          python tools/audit_evt_pre_20_external_response_bundle.py \
            --output artifacts/evt_pre_20_external_response_bundle_audit.json
      - name: Independent PCB-MIC native schematic structural audit
        run: |
          python tools/audit_pcb_mic_native_schematic_rev_a.py \
            --schematic hardware/kicad/native/PCB-MIC/PCB-MIC.kicad_sch \
            --output artifacts/pcb_mic_native_schematic_rev_a.json
      - name: Audit PCB-MIC controlled manufacturing handoff
        run: |
          python tools/audit_pcb_mic_manufacturing_handoff_rev_a.py \
            --output artifacts/pcb_mic_manufacturing_handoff_rev_a.json \
            --commit-sha "$GITHUB_SHA" \
            --require-clean-source
      - name: Independent PCB-MAIN capture-authority audit
        run: python tools/audit_pcb_main_capture_authority_rev_a.py
      - name: Second independent PCB-MAIN U1 electrical control
        run: python tools/verify_pcb_main_mcu_pin_authority_rev_a.py
      - name: Second independent PCB-MAIN storage and sensor control
        run: python tools/verify_pcb_main_storage_sensor_authority_rev_a.py
      - name: Second independent PCB-MAIN audio and AAD logic control
        run: python tools/verify_pcb_main_audio_logic_authority_rev_a.py
      - name: Second independent PCB-MAIN cellular modem control
        run: python tools/verify_pcb_main_cellular_authority_rev_a.py
      - name: Second independent PCB-MAIN dual-SIM control
        run: python tools/verify_pcb_main_dual_sim_authority_rev_a.py
      - name: Second independent PCB-MAIN GNSS control
        run: python tools/verify_pcb_main_gnss_authority_rev_a.py
      - name: Second independent PCB-MAIN LoRa control
        run: python tools/verify_pcb_main_lora_authority_rev_a.py
      - name: Second independent PCB-MAIN BLE control
        run: python tools/verify_pcb_main_ble_authority_rev_a.py
      - name: Second independent PCB-MAIN connector and fixture control
        run: python tools/verify_pcb_main_connector_fixture_authority_rev_a.py
      - name: Second independent PCB-MAIN passive and support control
        run: python tools/verify_pcb_main_passive_support_authority_rev_a.py
      - name: Second independent PCB-MAIN mechanical placement control
        run: python tools/verify_pcb_main_mechanical_placement_authority_rev_a.py
      - name: Audit PCB-MAIN placement and pre-route constraint interlocks
        run: |
          python tools/generate_pcb_main_schematic_rev_a.py --check
          python tools/audit_pcb_main_native_schematic_rev_a.py \
            --output artifacts/pcb_main_native_schematic_rev_a.json
          python tools/audit_pcb_main_hierarchy_rev_a.py \
            --output artifacts/pcb_main_hierarchy_rev_a.json
          python tools/generate_pcb_main_manufacturer_footprints_rev_a.py --check
          python tools/materialize_pcb_main_manufacturer_footprints_rev_a.py --check
          python tools/materialize_pcb_main_verified_library_footprints_rev_a.py --check
          python tools/generate_pcb_main_placement_repack_rev_a.py --check
          python tools/generate_pcb_main_routing_authority_rev_a.py --check
          python tools/audit_pcb_main_layout_candidate_rev_a.py
          python tools/audit_pcb_main_placement_clearance_rev_a.py \
            --output artifacts/pcb_main_placement_clearance_rev_a.json \
            --strict
          python tools/audit_pcb_main_routing_authority_rev_a.py \
            --output artifacts/pcb_main_routing_authority_rev_a.json
          python tools/audit_pcb_main_stackup_impedance_request_rev_a.py \
            --output artifacts/pcb_main_stackup_impedance_request_rev_a.json \
            --commit-sha "$GITHUB_SHA" \
            --require-clean-source
          python tools/audit_pcb_main_jlc06161h_3313_routing_basis_rev_a.py \
            --output artifacts/pcb_main_jlc06161h_3313_routing_basis_rev_a.json
          python tools/audit_pcb_main_rf_routeability_eco_003_rev_a.py \
            --output artifacts/pcb_main_rf_routeability_eco_003_rev_a.json
          python tools/audit_pcb_main_ground_domain_routing_candidate_rev_a.py \
            --output artifacts/pcb_main_ground_domain_routing_candidate_rev_a.json
          python tools/audit_pcb_main_signal_hard_nets_candidate_rev_a.py \
            --output artifacts/pcb_main_signal_hard_nets_candidate_rev_a.json
          python tools/audit_pcb_main_octospi_r8_eco_candidate_rev_a.py \
            --output artifacts/pcb_main_octospi_r8_eco_candidate_rev_a.json
          python tools/audit_pcb_main_octospi_r8_eco_application_rev_a.py \
            --output artifacts/pcb_main_octospi_r8_eco_application_rev_a.json
          python tools/audit_pcb_main_rf_p0_candidate_rev_a.py \
            --output artifacts/pcb_main_rf_p0_candidate_rev_a.json
          python tools/audit_pcb_main_rf_p0_application_rev_a.py \
            --output artifacts/pcb_main_rf_p0_application_rev_a.json
          python tools/audit_pcb_main_rf_return_001_candidate_rev_a.py \
            --output artifacts/pcb_main_rf_return_001_candidate_rev_a.json
          python tools/audit_pcb_main_gnss_rf_eco_001_candidate_rev_a.py \
            --output artifacts/pcb_main_gnss_rf_eco_001_candidate_rev_a.json
          python tools/generate_pcb_main_usb_placement_eco_001_candidate_rev_a.py --check
          python tools/audit_pcb_main_usb_placement_eco_001_candidate_rev_a.py \
            --output artifacts/pcb_main_usb_placement_eco_001_candidate_rev_a.json
          python tools/generate_pcb_main_usb_placement_eco_001_application_rev_a.py \
            --check \
            --output hardware/kicad/candidates/PCB-MAIN-USB-PLACEMENT-ECO-001/PCB-MAIN_USB_PLACEMENT_ECO_001_CANDIDATE_REV_A.kicad_pcb
          python tools/audit_pcb_main_usb_placement_eco_001_application_rev_a.py \
            --output artifacts/pcb_main_usb_placement_eco_001_application_rev_a.json
          python tools/generate_pcb_main_usb_source_routing_candidate_rev_a.py --check
          python tools/audit_pcb_main_usb_source_routing_candidate_rev_a.py \
            --output artifacts/pcb_main_usb_source_routing_001_candidate_rev_a.json
          python tools/generate_pcb_main_usb_source_routing_001_application_rev_a.py \
            --check \
            --output hardware/kicad/candidates/PCB-MAIN-USB-SOURCE-ROUTING-001/PCB-MAIN_USB_SOURCE_CANDIDATE_REV_A.kicad_pcb
          python tools/audit_pcb_main_usb_source_routing_001_application_rev_a.py \
            --output artifacts/pcb_main_usb_source_routing_001_application_rev_a.json
          python tools/generate_pcb_main_usb_cell_modem_routing_candidate_rev_a.py --check
          python tools/audit_pcb_main_usb_cell_modem_routing_candidate_rev_a.py \
            --output artifacts/pcb_main_usb_cell_modem_routing_001_candidate_rev_a.json
          python tools/generate_pcb_main_usb_cell_modem_routing_001_application_rev_a.py --check
          python tools/audit_pcb_main_usb_cell_modem_routing_001_application_rev_a.py \
            --output artifacts/pcb_main_usb_cell_modem_routing_001_application_rev_a.json
          python tools/generate_pcb_main_usb_cell_fixture_routing_candidate_rev_a.py --check
          python tools/audit_pcb_main_usb_cell_fixture_routing_candidate_rev_a.py \
            --output artifacts/pcb_main_usb_cell_fixture_routing_001_candidate_rev_a.json
          python tools/generate_pcb_main_usb_cell_fixture_routing_001_application_rev_a.py --check
          python tools/audit_pcb_main_usb_cell_fixture_routing_001_application_rev_a.py \
            --output artifacts/pcb_main_usb_cell_fixture_routing_001_application_rev_a.json
          python tools/generate_pcb_main_rf_remediation_application_rev_a.py --check
          python tools/audit_pcb_main_rf_remediation_application_rev_a.py \
            --output artifacts/pcb_main_rf_remediation_application_rev_a.json
          python tools/audit_pcb_main_assembler_dfm_stencil_request_rev_a.py \
            --output artifacts/pcb_main_assembler_dfm_stencil_request_rev_a.json \
            --commit-sha "$GITHUB_SHA" \
            --require-clean-source
          python tools/audit_pcb_main_mechanical_eco_candidate_rev_a.py \
            --output artifacts/pcb_main_mechanical_eco_candidate_rev_a.json
          python tools/audit_pcb_main_mech_eco_002_rev_a.py \
            --output artifacts/pcb_main_mech_eco_002_rev_a.json
      - name: Audit PCB-PWR placement and pre-route constraint interlocks
        run: |
          python tools/audit_pcb_pwr_hierarchy_rev_a.py \
            --output artifacts/pcb_pwr_hierarchy_rev_a.json
          python tools/generate_pcb_pwr_routing_authority_rev_a.py --check
          python tools/audit_pcb_pwr_layout_candidate_rev_a.py
          python tools/audit_pcb_pwr_placement_clearance_rev_a.py \
            --output artifacts/pcb_pwr_placement_clearance_rev_a.json \
            --strict
          python tools/generate_pcb_pwr_buck_placement_eco_001_candidate_rev_a.py \
            --check
          python tools/audit_pcb_pwr_buck_placement_eco_001_candidate_rev_a.py \
            --output artifacts/pcb_pwr_buck_placement_eco_001_candidate_rev_a.json
          python tools/generate_pcb_pwr_buck_placement_eco_001_application_rev_a.py \
            --check
          python tools/audit_pcb_pwr_buck_placement_eco_001_application_rev_a.py \
            --output artifacts/pcb_pwr_buck_placement_eco_001_application_rev_a.json
          python tools/generate_pcb_pwr_buck_warning_remediation_001_candidate_rev_a.py \
            --check
          python tools/audit_pcb_pwr_buck_warning_remediation_001_candidate_rev_a.py \
            --output artifacts/pcb_pwr_buck_warning_remediation_001_candidate_rev_a.json
          python tools/audit_pcb_pwr_routing_authority_rev_a.py \
            --output artifacts/pcb_pwr_routing_authority_rev_a.json
          python tools/generate_pcb_pwr_evt_route_rules_rev_a.py --check
          python tools/audit_pcb_pwr_jlc04161h_3313_evt_routing_basis_rev_a.py \
            --output artifacts/pcb_pwr_evt_routing_basis_rev_a.json
          python tools/audit_pcb_pwr_dim_003_request_rev_a.py \
            --output artifacts/pcb_pwr_dim_003_request_rev_a.json \
            --commit-sha "$GITHUB_SHA" \
            --require-clean-source
          python tools/audit_pcb_pwr_stackup_copper_request_rev_a.py \
            --output artifacts/pcb_pwr_stackup_copper_request_rev_a.json \
            --commit-sha "$GITHUB_SHA" \
            --require-clean-source
      - name: First-pass configuration and hardware baseline validation
        run: python tools/validate_evt_pre_20.py
      - name: Cross-check locked Rev.A clock policy
        run: python tools/validate_clock_policy.py
      - name: Cross-check fail-closed RU868 firmware profile
        run: python tools/validate_ru868_firmware_profile.py
      - name: Cross-check BG95 public-APN MQTT TLS host contract
        run: python tools/validate_bg95_transport_contract_rev_a.py
      - name: QG-1 portable dual-SIM safe failover contract
        run: python tools/validate_dual_sim_failover_contract.py
      - name: QG-2 independent dual-SIM state-machine audit
        run: python tools/audit_dual_sim_failover_technical.py
      - name: QG-1 protected cellular heartbeat traceability
        run: python tools/validate_cellular_heartbeat_contract_rev_a.py
      - name: QG-1 portable event store-and-forward outbox
        run: python tools/validate_event_outbox_contract.py
      - name: QG-1 event application receipt traceability
        run: python tools/validate_event_receipt_contract.py
      - name: QG-1 hierarchical 4-8 window contract
        run: python tools/validate_hierarchy_consensus_contract.py
      - name: QG-1 installation position persistence contract
        run: python tools/validate_installation_store_contract.py
      - name: QG-1 local installation commissioning contract
        run: python tools/validate_installation_commissioning_contract.py
      - name: QG-2 independent installation commissioning audit
        run: python tools/audit_installation_commissioning_technical.py
      - name: QG-1 Android installation read-back contract
        run: python tools/validate_android_installation_contract.py
      - name: QG-2 independent Android/firmware hash audit
        run: python tools/audit_android_installation_contract.py
      - name: Verify generated STM32 target contract is current
        run: python tools/generate_evt_pre_20_target_contract.py --check
      - name: QG-1 target contract completeness and traceability
        run: python tools/validate_evt_pre_20_target_contract.py
      - name: QG-2 independent target technical audit
        run: python tools/audit_evt_pre_20_target_technical.py
      - name: QG-1 generated CubeMX IOC completeness and provenance
        run: python tools/validate_evt_pre_20_cubemx_ioc.py
      - name: QG-2 independent CubeMX pin and EXTI audit
        run: python tools/audit_evt_pre_20_cubemx_ioc_technical.py
      - name: Verify pinned STM32 CMSIS vendor files
        run: python tools/import_evt_pre_20_stm32_vendor.py --check
      - name: QG-1 STM32 scaffold completeness and provenance
        run: python tools/validate_evt_pre_20_stm32_scaffold.py
      - name: QG-2 independent STM32 startup and memory audit
        run: python tools/audit_evt_pre_20_stm32_scaffold_technical.py
      - name: Cross-check Rev.A component and connector freeze
        run: |
          python tools/validate_rev_a_component_freeze.py
          python tools/audit_pcb_pwr_passive_authority_rev_a.py \
            --schematic hardware/kicad/native/PCB-PWR/PCB-PWR.kicad_sch
      - name: Second-pass release completeness audit
        run: python tools/audit_evt_pre_20_release.py
      - name: Upload audit and generated Rev.A BOM
        uses: actions/upload-artifact@v4
        with:
          name: evt-pre-20-release-audit
          path: |
            artifacts/evt_pre_20_release_audit.json
            artifacts/evt_pre_20_hardware_release_audit.json
            artifacts/evt_pre_20_bom_qg1.json
            artifacts/evt_pre_20_bom_workbook_audit.json
            artifacts/evt_pre_20_bom_qg2.json
            artifacts/pcb_pwr_input_protection_qualification_rev_a.json
            artifacts/pcb_pwr_input_protection_primary_source_evidence_rev_a.json
            artifacts/pcb_pwr_input_protection_procurement_identity_rev_a.json
            artifacts/pcb_layer_count_authority_rev_a.json
            artifacts/harness_manufacturing_rev_a.json
            artifacts/pcb_mic_native_schematic_rev_a.json
            artifacts/pcb_mic_manufacturing_handoff_rev_a.json
            artifacts/pcb_main_capture_authority_rev_a.json
            artifacts/pcb_main_native_schematic_rev_a.json
            artifacts/pcb_main_hierarchy_rev_a.json
            artifacts/pcb_main_placement_clearance_rev_a.json
            artifacts/pcb_main_routing_authority_rev_a.json
            artifacts/pcb_main_stackup_impedance_request_rev_a.json
            artifacts/pcb_main_jlc06161h_3313_routing_basis_rev_a.json
            artifacts/pcb_main_rf_routeability_eco_003_rev_a.json
            artifacts/pcb_main_ground_domain_routing_candidate_rev_a.json
            artifacts/pcb_main_signal_hard_nets_candidate_rev_a.json
            artifacts/pcb_main_octospi_r8_eco_candidate_rev_a.json
            artifacts/pcb_main_octospi_r8_eco_application_rev_a.json
            artifacts/pcb_main_rf_p0_candidate_rev_a.json
            artifacts/pcb_main_rf_return_001_candidate_rev_a.json
            artifacts/pcb_main_gnss_rf_eco_001_candidate_rev_a.json
            artifacts/pcb_main_usb_placement_eco_001_candidate_rev_a.json
            artifacts/pcb_main_usb_placement_eco_001_application_rev_a.json
            artifacts/pcb_main_usb_source_routing_001_candidate_rev_a.json
            artifacts/pcb_main_usb_source_routing_001_application_rev_a.json
            artifacts/pcb_main_usb_cell_modem_routing_001_candidate_rev_a.json
            artifacts/pcb_main_usb_cell_modem_routing_001_application_rev_a.json
            artifacts/pcb_main_usb_cell_fixture_routing_001_candidate_rev_a.json
            artifacts/pcb_main_usb_cell_fixture_routing_001_application_rev_a.json
            artifacts/pcb_main_rf_remediation_application_rev_a.json
            artifacts/pcb_main_assembler_dfm_stencil_request_rev_a.json
            artifacts/pcb_main_mechanical_eco_candidate_rev_a.json
            artifacts/pcb_main_mech_eco_002_rev_a.json
            artifacts/pcb_pwr_placement_clearance_rev_a.json
            artifacts/pcb_pwr_buck_placement_eco_001_candidate_rev_a.json
            artifacts/pcb_pwr_buck_placement_eco_001_application_rev_a.json
            artifacts/pcb_pwr_buck_warning_remediation_001_candidate_rev_a.json
            artifacts/pcb_pwr_hierarchy_rev_a.json
            artifacts/pcb_pwr_routing_authority_rev_a.json
            artifacts/pcb_pwr_evt_routing_basis_rev_a.json
            artifacts/pcb_pwr_dim_003_request_rev_a.json
            artifacts/pcb_pwr_stackup_copper_request_rev_a.json
            hardware/reviews/PCB_PWR_DIM_003_REQUEST_REV_A.json
            hardware/reviews/PCB_PWR_DIM_003_REQUEST_REV_A.md
            hardware/reviews/PCB_PWR_DIM_003_RESPONSE_REV_A.csv
            hardware/reviews/PCB_PWR_DIM_003_EVT_AUTHORITY_REV_A.json
            hardware/reviews/PCB_PWR_DIM_003_EVT_AUTHORITY_REV_A.md
            mechanics/pcb_pwr/PCB_PWR_EVT_MECHANICAL_ENVELOPE_REV_A.step
            hardware/reviews/PCB_PWR_STACKUP_COPPER_REQUEST_REV_A.json
            hardware/reviews/PCB_PWR_STACKUP_COPPER_REQUEST_REV_A.md
            hardware/reviews/PCB_PWR_STACKUP_COPPER_RESPONSE_REV_A.csv
            hardware/reviews/PCB_PWR_JLC04161H_3313_EVT_ROUTING_BASIS_REV_A.json
            hardware/reviews/PCB_PWR_JLC04161H_3313_EVT_ROUTING_BASIS_REV_A.md
            hardware/PCB_PWR_EVT_ROUTE_RULES_REV_A.csv
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_QUALIFICATION_REV_A.json
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_QUALIFICATION_REV_A.md
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_TEST_MATRIX_REV_A.csv
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_PRIMARY_SOURCE_EVIDENCE_REV_A.json
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_PRIMARY_SOURCE_EVIDENCE_REV_A.md
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_PROCUREMENT_IDENTITY_REV_A.json
            hardware/reviews/PCB_PWR_INPUT_PROTECTION_PROCUREMENT_IDENTITY_REV_A.md
            artifacts/pcb_main_mcu_pin_authority_rev_a.json
            artifacts/pcb_main_storage_sensor_authority_rev_a.json
            artifacts/pcb_main_audio_logic_authority_rev_a.json
            artifacts/pcb_main_cellular_authority_rev_a.json
            artifacts/pcb_main_dual_sim_authority_rev_a.json
            artifacts/pcb_main_gnss_authority_rev_a.json
            artifacts/pcb_main_lora_authority_rev_a.json
            artifacts/pcb_main_ble_authority_rev_a.json
            artifacts/pcb_main_connector_fixture_authority_rev_a.json
            artifacts/pcb_main_passive_support_authority_rev_a.json
            artifacts/pcb_main_mechanical_placement_authority_rev_a.json
            hardware/EVT_PRE_20_BOM_REV_A.csv
            hardware/EVT_PRE_20_BOM_PROCUREMENT_REV_A.csv
            hardware/PCB_LAYER_COUNT_AUTHORITY_REV_A.csv
            hardware/PCB_LAYER_COUNT_AUTHORITY_REV_A.md
            hardware/HARNESS_MANUFACTURING_SCHEDULE_REV_A.csv
            hardware/HARNESS_MANUFACTURING_DRAWING_REV_A.md
            hardware/reviews/HARNESS_SUPPLIER_CAPABILITY_REQUEST_REV_A.json
            hardware/reviews/HARNESS_SUPPLIER_CAPABILITY_REQUEST_REV_A.md
            hardware/reviews/HARNESS_SUPPLIER_CAPABILITY_RESPONSE_REV_A.csv
            hardware/PCB_MAIN_PASSIVE_SUPPORT_AUTHORITY_REV_A.csv
            hardware/PCB_MAIN_PASSIVE_SUPPORT_AUTHORITY_REV_A.md
            hardware/PCB_MAIN_MECHANICAL_PLACEMENT_AUTHORITY_REV_A.csv
            hardware/PCB_MAIN_MECHANICAL_PLACEMENT_AUTHORITY_REV_A.md
            hardware/PCB_MAIN_ROUTING_AUTHORITY_REV_A.csv
            hardware/PCB_MAIN_ROUTING_AUTHORITY_REV_A.md
            hardware/PCB_PWR_ROUTING_AUTHORITY_REV_A.csv
