# Partition Manager map for evt_pre_20_ble (matches the fixed-partitions in the board DTS):
# MCUboot 48 KiB | primary 472 KiB | secondary 472 KiB | settings 32 KiB  (nRF52840, 1 MiB flash)
mcuboot:
  address: 0x0
  size: 0xC000
  region: flash_primary
mcuboot_pad:
  address: 0xC000
  size: 0x200
mcuboot_primary_app:
  address: 0xC200
  size: 0x75E00
mcuboot_primary:
  address: 0xC000
  size: 0x76000
  orig_span: &id001
  - mcuboot_pad
  - app
  region: flash_primary
  span: *id001
app:
  address: 0xC200
  size: 0x75E00
mcuboot_secondary:
  address: 0x82000
  size: 0x76000
  region: flash_primary
settings_storage:
  address: 0xF8000
  size: 0x8000
  region: flash_primary
sram_primary:
  address: 0x20000000
  size: 0x40000
  region: sram_primary
