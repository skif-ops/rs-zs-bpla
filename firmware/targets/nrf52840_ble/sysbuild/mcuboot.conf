# MCUboot image for the Dioneya BLE bridge (U11 nRF52840). Recovery path of ICD addendum C.6:
# the STM32 asserts BLE_DFU_REQ (P0.15, active LOW) and releases nRESET; the bootloader samples the pin at
# boot and, when LOW, stays in serial recovery on the IPC UART (uart0 = P0.06/P0.08) where the STM32 uploads
# the new image with the mcumgr SMP protocol.  Without the request MCUboot validates and boots slot0.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_BOOT_SERIAL_DETECT_DELAY=50
CONFIG_MCUBOOT_INDICATION_LED=n
CONFIG_BOOT_MAX_IMG_SECTORS=256
# No UART console (the UART belongs to the recovery channel) and no LEDs on the carrier.
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_TINYCRYPT=y
