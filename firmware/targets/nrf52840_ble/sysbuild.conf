# NCS sysbuild: MCUboot in front of the bridge application (flash map: boards/dioneya/evt_pre_20_ble + pm_static.yml).
# The signing key is the pilot key from the PKI: muhoed-pki nrf-boot-key  ->  <pki>/nrf-boot/nrf-boot.key.pem
#   west build -b evt_pre_20_ble firmware/targets/nrf52840_ble -- -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"/abs/path/nrf-boot.key.pem\"
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# NCS 2.7 / MCUboot uses the move-based, no-scratch swap under this
# Kconfig name.  The two 472 KiB slots in pm_static.yml are equal-sized.
SB_CONFIG_MCUBOOT_MODE_SWAP_WITHOUT_SCRATCH=y
