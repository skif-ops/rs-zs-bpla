    ordinary_sim_allowed_for_evt: true
    public_apn_allowed_for_evt: true
    pilot_apn_policy: public_only
    private_apn_profile_supported_in_pilot: false
    apn_mode_switch_supported_in_pilot: false
    tariff_is_evt_acceptance_input: false
    sim_architecture: dual_sim_single_standby
    physical_nano_sim_slots: 2
    simultaneously_active_sim_count: 1
    pilot_operator_candidates: [MTS, MegaFon, Beeline, T2_Tele2, GLONASS_supplied_SIM]
    static_public_ip_required: false
    inbound_station_connection_required: false
    store_and_forward_required: true
  lora:
    role: backup_event_transport
    common_pcb: true
    pilot_profile: RU868
    pilot_frequency_windows_mhz: [[864.0, 865.0], [868.7, 869.2]]
