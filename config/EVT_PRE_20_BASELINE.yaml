  mcu_family: STM32U585
  mcu_exact_mpn: STM32U585VIT6Q
  mcu_selection_status: SELECTED_PENDING_SCHEMATIC_AND_SAMPLE
  mcu_package_policy: prefer_inspectable_non_BGA_for_20_unit_EVT
  clocking:
    policy_id: REV_A_INTERNAL_HSI_MSI_PLL_NO_HSE
